<!doctype html><html><head><meta charset="utf-8">
<!-- Atlas viewer for validation: ?style=<styles/name>&lon=&lat=&z=[&show=<layer id part>] -->
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<style>html,body,#map{margin:0;width:100%;height:100%}</style></head><body><div id="map"></div>
<script>
const q = new URLSearchParams(location.search);
const protocol = new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles', protocol.tile);
window.errors = []; const errors = window.errors;
const map = new maplibregl.Map({ container: 'map',
  center: [+(q.get('lon') || 10), +(q.get('lat') || 50)], zoom: +(q.get('z') || 4), attributionControl: false, fadeDuration: 0 });
map.setStyle('/atlas/styles/' + (q.get('style') || 'atlas-default') + '.json', { transformStyle: (prev, next) => {
  const abs = u => u.startsWith('/') ? location.origin + u : u;
  next.sprite = abs(next.sprite); next.glyphs = abs(next.glyphs);
  if (q.get('show')) for (const l of next.layers) if (l.layout && l.layout.visibility === 'none' && l.id.includes(q.get('show'))) l.layout.visibility = 'visible';
  return next; } });
map.on('error', e => { errors.push(String(e.error && e.error.message || e));  });
map.on('idle', () => { document.title = 'idle ' + errors.length; const d = document.createElement('pre'); d.id='err'; d.textContent = errors.slice(0,5).join('\n'); d.style='position:absolute;top:0;left:0;color:red;background:#fff8;font-size:10px;max-width:100%'; document.body.appendChild(d); });
</script></body></html>
