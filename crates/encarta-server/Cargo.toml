[package]
name = "encarta-server"
version = "0.1.0"
edition = "2024"
description = "Read-only HTTP server for the converted Encarta output (out/)"

[dependencies]
encarta-formats = { path = "../encarta-formats" }
encarta-search = { path = "../encarta-search" }
anyhow = "1"
flate2 = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tokio-util = { version = "0.7", features = ["io"] }
http-body = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
