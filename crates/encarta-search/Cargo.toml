[package]
name = "encarta-search"
version = "0.1.0"
edition = "2024"
description = "Full-text search, autocomplete and spelling for the converted Encarta content (tantivy + fst)"

[dependencies]
anyhow = "1"
tantivy = "0.26"
fst = { version = "0.4", features = ["levenshtein"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
